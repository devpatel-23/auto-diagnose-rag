# render.yaml
# ============================================================
# Render.com deployment configuration
# This file defines ALL services that Render will deploy.
#
# Commit this to your git repo. When you connect the repo
# to Render, it reads this file automatically.
# ============================================================

services:
  # ── Backend API ──────────────────────────────────────────
  - type: web
    name: vehicle-repair-chatbot-api
    env: python
    region: oregon       # Choose: oregon, frankfurt, singapore, ohio
    plan: starter        # Free tier: starter, standard, pro
    
    # Build command: installs all dependencies
    buildCommand: pip install -r requirements.txt
    
    # Start command: starts the FastAPI server
    # --host 0.0.0.0 is required for Render (binds to all interfaces)
    # $PORT is provided by Render automatically
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    
    # Health check — Render pings this to know if app is alive
    healthCheckPath: /admin/health
    
    # Auto-deploy when you push to main branch
    autoDeploy: true
    
    # Environment variables
    # Set OPENAI_API_KEY in Render dashboard (not here — don't commit secrets!)
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false   # Must be set manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: vehicle-repair-chatbot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value

  # ── Frontend (Chainlit) ──────────────────────────────────
  - type: web
    name: vehicle-repair-chatbot-ui
    env: python
    region: oregon
    plan: starter
    
    buildCommand: pip install -r requirements.txt
    
    # Note: chainlit run requires the file path and --host flag
    startCommand: chainlit run frontend/app.py --host 0.0.0.0 --port $PORT
    
    autoDeploy: true
    
    envVars:
      - key: APP_ENV
        value: production
      - key: BACKEND_URL
        value: https://vehicle-repair-chatbot-api.onrender.com

# ── Database ────────────────────────────────────────────────
databases:
  - name: vehicle-repair-chatbot-db
    databaseName: vehicle_repair_bot
    user: vehicle_repair_user
    plan: starter       # Free tier (limited to 1GB)
    region: oregon
    # NOTE: Free PostgreSQL on Render does NOT include pgvector by default.
    # You need Render's "Starter" plan or higher for custom extensions.
    # Alternative: Use Supabase.com (free, includes pgvector)
