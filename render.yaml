services:
  - type: web
    name: auto-diagnose-rag-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: auto-diagnose-db
          property: connectionString

databases:
  - name: auto-diagnose-db
    databaseName: vehicle_repair_prod
    user: db_admin
    plan: free
