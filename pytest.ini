# pytest.ini
# -----------
# Pytest configuration.
# Pytest reads this automatically when you run `pytest`.
#
# SETTINGS EXPLAINED:
# testpaths:      Where to look for tests (saves time vs scanning everything)
# asyncio_mode:   "auto" means async test functions run without @pytest.mark.asyncio
# filterwarnings: Suppress known harmless deprecation warnings in dependencies

[pytest]
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.*:
    ignore::DeprecationWarning:pydantic.*:
log_cli = true
log_cli_level = INFO
